<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مترجم ونطق الروسية الاحترافي 🇷🇺✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
            font-family: 'Cairo', sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 20px;
            font-weight: 900;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #94a3b8;
        }

        textarea {
            width: 100%;
            height: 90px;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid #334155;
            border-radius: 12px;
            color: #fff;
            padding: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            resize: none;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        textarea:focus {
            border-color: #38bdf8;
        }

        .btn-translate {
            width: 100%;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.4);
            transition: 0.3s;
        }

        .btn-translate:hover {
            transform: scale(1.02);
        }

        .result-section {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .box {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px 15px;
        }

        .box-title {
            font-size: 12px;
            color: #38bdf8;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .box-content {
            font-size: 16px;
            color: #f8fafc;
            font-weight: 700;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>مترجم روسي مع النطق 🇷🇺</h2>
        
        <label for="inputText">اكتب (عربي أو إنجليزي):</label>
        <textarea id="inputText" placeholder="مثال: مرحبًا بك..."></textarea>

        <button class="btn-translate" onclick="translateAndPronounce()">ترجم واعرض النطق 🚀</button>

        <div class="result-section">
            <div class="box">
                <div class="box-title">الترجمة بالروسية (Cyrillic):</div>
                <div id="ruText" class="box-content">---</div>
            </div>

            <div class="box">
                <div class="box-title">النطق بالحروف الإنجليزية (English Phonics):</div>
                <div id="enPhonics" class="box-content">---</div>
            </div>

            <div class="box">
                <div class="box-title">النطق بالحروف العربية (Arabic Phonics):</div>
                <div id="arPhonics" class="box-content">---</div>
            </div>
        </div>
    </div>

    <script>
        async function translateAndPronounce() {
            const text = document.getElementById('inputText').value.trim();
            const ruDiv = document.getElementById('ruText');
            const enPhonicsDiv = document.getElementById('enPhonics');
            const arPhonicsDiv = document.getElementById('arPhonics');

            if (!text) {
                ruDiv.innerText = "الرجاء كتابة نص أولاً!";
                enPhonicsDiv.innerText = "---";
                arPhonicsDiv.innerText = "---";
                return;
            }

            ruDiv.innerText = "جاري المعالجة...";
            enPhonicsDiv.innerText = "...";
            arPhonicsDiv.innerText = "...";

            try {
                // 1. جلب الترجمة الأساسية للروسية
                const transUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ru&dt=t&q=${encodeURIComponent(text)}`;
                const res = await fetch(transUrl);
                const data = await res.json();
                
                let translated = "";
                if (data && data[0]) {
                    data[0].forEach(item => {
                        if (item[0]) translated += item[0];
                    });
                }

                ruDiv.innerText = translated || "خطأ في الترجمة";

                if (translated) {
                    // 2. جلب النطق بالحروف اللاتينية/الإنجليزية من جوجل
                    const phoneticUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ru&tl=en&dt=rm&q=${encodeURIComponent(translated)}`;
                    const pRes = await fetch(phoneticUrl);
                    const pData = await pRes.json();
                    
                    let englishPhonics = "";
                    // غالباً جوجل بتحط النطق في العنصر الثالث أو الرابع من استجابة الـ transliteration
                    if (pData && pData[0]) {
                        pData[0].forEach(item => {
                            if (item[3]) englishPhonics += item[3];
                        });
                    }
                    
                    // لو ملقاش نطق جاهز، نعرض النص الروسي مؤقتاً
                    if (!englishPhonics) englishPhonics = translated;
                    enPhonicsDiv.innerText = englishPhonics;

                    // 3. تحويل النطق الإنجليزي لحروف عربية تقريبية عشان تقراها عالهادي
                    arPhonicsDiv.innerText = convertToArabicPhonics(englishPhonics);
                }

            } catch (err) {
                ruDiv.innerText = "تعذر الاتصال بالخدمة.";
                enPhonicsDiv.innerText = "---";
                arPhonicsDiv.innerText = "---";
            }
        }

        // دالة ذكية لتحويل النطق الإنجليزي الحرفي للروسي إلى نطق عربي تقريبي ومفهوم
        function convertToArabicPhonics(str) {
            return str
                .toLowerCase()
                .replace(/sh/g, 'ش')
                .replace(/ch/g, 'تش')
                .replace(/zh/g, 'ژ / ج')
                .replace(/kh/g, 'خ')
                .replace(/ts/g, 'تس')
                .replace(/oo/g, 'وُو')
                .replace(/ee/g, 'يِي')
                .replace(/ya/g, 'يا')
                .replace(/ye/g, 'يي')
                .replace(/yu/g, 'يو')
                .replace(/yo/g, 'يو')
                .replace(/a/g, 'ا')
                .replace(/b/g, 'ب')
                .replace(/v/g, 'ڤ/ف')
                .replace(/g/g, 'ج/گ')
                .replace(/d/g, 'د')
                .replace(/e/g, 'إِ')
                .replace(/z/g, 'ز')
                .replace(/i/g, 'ي')
                .replace(/y/g, 'ي')
                .replace(/k/g, 'ك')
                .replace(/l/g, 'ل')
                .replace(/m/g, 'م')
                .replace(/n/g, 'ن')
                .replace(/o/g, 'وُ')
                .replace(/p/g, 'پ')
                .replace(/r/g, 'ر')
                .replace(/s/g, 'س')
                .replace(/t/g, 'ت')
                .replace(/u/g, 'وُ')
                .replace(/f/g, 'ف')
                .replace(/h/g, 'هـ');
        }
    </script>

</body>
</html>
